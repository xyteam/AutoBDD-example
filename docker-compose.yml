# run test only (requires demo-app up: make demo-up, or the e2e-test target does it)
# docker-compose run --rm autobdd-example-run "make e2e-test"
#
# DEV-MODE: mount the working-tree AutoBDD over the image's baked copy so AutoBDD-example
# runs against live AutoBDD source (phase-0) instead of the stale image framework.
#   * AUTOBDD_SRC defaults to the sibling ../AutoBDD directory. Set it explicitly to
#     point at your checkout:  AUTOBDD_SRC=/abs/path/to/AutoBDD docker-compose ...
#   * Patched startup scripts (dev/*.startup.sh) skip the node_modules refresh when
#     AUTOBDD_DEV_MOUNT=1 so the working tree's own node_modules is never clobbered.
version: '3.5'
services:

  # dev container for developing autobdd test
  autobdd-example-dev:
    image: "xyteam/autobdd:${AutoBDD_Ver}"
    container_name: autobdd-example-dev
    shm_size: 1536M
    user: root
    privileged: true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:delegated
      - ${AUTOBDD_SRC:-../AutoBDD}:/home/${USER}/Projects/AutoBDD:consistent
      - ${PWD}:/home/${USER}/Projects/AutoBDD/test-projects/${ABDD_PROJECT}:consistent
      - ${PWD}/dev/autobdd-dev.startup.sh:/root/autobdd-dev.startup.sh:ro
    ports:
      - "5924:5900"
      - "2224:22"
      - "8004:8000"
    environment:
      - USER=${USER}
      - ABDD_PROJECT=${ABDD_PROJECT}
      - AUTOBDD_DEV_MOUNT=1
      - HOSTOS=${HOSTOS}
      - USERID=${USERID}
      - GROUPID=${GROUPID}
      - PASSWORD=${PASSWORD}
      - VNC_PASSWORD=${VNC_PASSWORD}
      - RESOLUTION=1920x1200x24
    entrypoint: "/root/autobdd-dev.startup.sh"

  # run container for running autobdd test
  autobdd-example-run:
    image: "xyteam/autobdd:${AutoBDD_Ver}"
    container_name: autobdd-example-run
    shm_size: 1536M
    user: root
    privileged: true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:delegated
      - ${AUTOBDD_SRC:-../AutoBDD}:/home/${USER}/Projects/AutoBDD:consistent
      - ${PWD}:/home/${USER}/Projects/AutoBDD/test-projects/${ABDD_PROJECT}:consistent
      - ${PWD}/dev/autobdd-run.startup.sh:/root/autobdd-run.startup.sh:ro
    environment:
      - USER=${USER}
      - ABDD_PROJECT=${ABDD_PROJECT}
      - AUTOBDD_DEV_MOUNT=1
      - HOSTOS=${HOSTOS}
      - USERID=${USERID}
      - GROUPID=${GROUPID}
      - PYTHONUNBUFFERED=1
      - REPORTDIR=${REPORTDIR}
      - MOVIE=${MOVIE}
      - SCREENSHOT=${SCREENSHOT}
      - SCREENSHOTREMARK=${SCREENSHOTREMARK}
    entrypoint: "/root/autobdd-run.startup.sh"
