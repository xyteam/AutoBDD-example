<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Sign in to GitHub · GitHub</title>
  <style>
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; color: #24292e; background: #f6f8fa; }
    a { color: #0366d6; text-decoration: none; }
    .login-header { text-align: center; padding: 48px 16px 8px; }
    .login-header .octicon-mark-github { fill: #24292e; }
    .login-card { max-width: 340px; margin: 16px auto 0; padding: 20px; background: #fff; border: 1px solid #d1d5da; border-radius: 6px; }
    .login-card label { display: block; font-size: 14px; font-weight: 600; margin-bottom: 6px; }
    .login-card input[type="text"], .login-card input[type="password"] { width: 100%; padding: 8px 12px; font-size: 14px; border: 1px solid #d1d5da; border-radius: 6px; box-sizing: border-box; margin-bottom: 16px; }
    .login-card input[type="submit"] { width: 100%; padding: 8px 12px; font-size: 14px; font-weight: 600; color: #fff; background-color: #2ea44f; border: 1px solid rgba(27,31,35,.15); border-radius: 6px; cursor: pointer; }
    .flash { padding: 16px; border-radius: 6px; font-size: 14px; }
    .flash-error { color: #86181d; background-color: #ffdce0; border: 1px solid rgba(27,31,35,.15); }
    .flash-full { border-radius: 6px; }
    .flash-container { max-width: 340px; margin: 16px auto 0; }
    .create-account { max-width: 340px; margin: 16px auto 0; padding: 20px; background: #fff; border: 1px solid #d1d5da; border-radius: 6px; font-size: 14px; text-align: center; }
    .footer { text-align: center; color: #6a737d; font-size: 12px; padding: 24px; }
  </style>
</head>
<body>
  <header class="login-header">
    <svg class="octicon octicon-mark-github" height="48" viewBox="0 0 16 16" version="1.1" width="48" aria-hidden="true"><path fill-rule="evenodd" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>
  </header>

  <div id="js-flash-container" class="flash-container">
    <div class="flash flash-full flash-error" id="login-error" style="display:none;">
      Incorrect username or password.
    </div>
  </div>

  <main class="login-card">
    <form id="login-form" accept-charset="UTF-8" action="http://localhost:8090/github/login.html" method="post">
      <label for="login_field">Username or email address</label>
      <input type="text" name="login" id="login_field" class="form-control" autofocus autocomplete="username">
      <label for="password">Password</label>
      <input type="password" name="password" id="password" class="form-control" autocomplete="current-password">
      <input type="submit" name="commit" value="Sign in" class="btn btn-primary btn-block">
    </form>
  </main>

  <div class="create-account">
    New to GitHub? <a href="#">Create an account</a>
  </div>

  <footer class="footer">
    © 2026 GitHub, Inc. This is a local mock page for demonstration purposes.
  </footer>

  <script>
    (function () {
      var loginForm = document.getElementById('login-form');
      var loginError = document.getElementById('login-error');
      function showError() {
        loginError.style.display = 'block';
      }
      loginForm.addEventListener('submit', function (e) {
        e.preventDefault();
        showError();
      });
      var commit = document.querySelector("input[type='submit'][value='Sign in']");
      if (commit) {
        commit.addEventListener('click', function (e) {
          // The submit event (handled above) performs the reveal; this listener
          // only guards against forms that skip submission when validation blocks it.
          showError();
        });
      }
    })();
  </script>
</body>
</html>
