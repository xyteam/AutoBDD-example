<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact Us | vArmour</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: Arial, Helvetica, sans-serif;
    background: #ffffff;
    color: #2b2b2b;
  }
  .page {
    max-width: 900px;
    margin: 0 auto;
    padding: 0 24px;
  }
  h1 {
    font-size: 72px;
    font-weight: bold;
    color: #10233f;
    letter-spacing: 1px;
    margin: 150px 0 14px;
    text-align: center;
  }
  .lead {
    font-size: 21px;
    line-height: 1.6;
    color: #4a5568;
    text-align: center;
    margin-bottom: 48px;
  }
  .contact-grid {
    display: flex;
    gap: 26px;
    flex-wrap: wrap;
    margin-bottom: 60px;
  }
  .contact-card {
    flex: 1 1 260px;
    border: 1px solid #e4e4e4;
    border-radius: 6px;
    padding: 22px;
    text-align: center;
  }
  .contact-card h3 { color: #10233f; font-size: 17px; margin-bottom: 6px; }
  .contact-card p { font-size: 15px; color: #55617a; line-height: 1.5; }
</style>
</head>
<body>

  <main class="page">
    <h1>Contact Us</h1>
    <p class="lead">
      Talk to a security specialist about stopping lateral movement with
      adaptive micro-segmentation.
    </p>
    <div class="contact-grid">
      <div class="contact-card">
        <h3>Sales</h3>
        <p>sales@example.test<br>+1 (800) 555-0142</p>
      </div>
      <div class="contact-card">
        <h3>Support</h3>
        <p>support@example.test<br>+1 (800) 555-0199</p>
      </div>
      <div class="contact-card">
        <h3>Headquarters</h3>
        <p>1 Almaden Boulevard<br>San Jose, CA 95113</p>
      </div>
    </div>
  </main>

</body>
</html>
